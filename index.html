<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San José Gregorio Hernández - Redirigiendo...</title>
    <meta name="description" content="Sitio dedicado a San José Gregorio Hernández, primer santo venezolano">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .redirect-container {
            text-align: center;
            color: white;
            padding: 2rem;
        }
        .redirect-container h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        .redirect-container a {
            color: white;
            text-decoration: underline;
            font-size: 1.1rem;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

    <div class="redirect-container">
        <div class="spinner"></div>
        <h1>Redirigiendo a San José Gregorio Hernández</h1>
